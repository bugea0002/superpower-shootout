<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SUPERPOWER SHOOTOUT - 이능력 승부차기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmode&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="arcade-shell">
      <div id="canvas-wrapper">
        <canvas id="game-canvas" width="480" height="270"></canvas>
        <div id="crt-overlay"></div>
      </div>
      <div id="controls-bar">
        <div class="ctrl-group">
          <span class="key-badge">WASD / 방향키</span> 조준 · 다이빙 방향
        </div>
        <div class="ctrl-group">
          <span class="key-badge">SPACE / 클릭</span> 파워 게이지 · 세이브 점프
        </div>
        <div class="ctrl-group">
          <span class="key-badge">1</span> <span class="key-badge">2</span> <span class="key-badge">3</span> <span class="key-badge">4</span> 초능력 스킬 선택
        </div>
        <div class="ctrl-group">
          <span class="key-badge">M</span> 사운드 ON/OFF &nbsp;|&nbsp; <span class="key-badge">C</span> CRT 필터
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
