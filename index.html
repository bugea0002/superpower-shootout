<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>SUPERPOWER SHOOTOUT - 이능력 승부차기</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" />
  </head>
  <body>
    <div id="arcade-shell">
      <div id="canvas-wrapper">
        <canvas id="game-canvas" width="480" height="270"></canvas>
        <div id="crt-overlay"></div>
      </div>
      <div id="screen-controls">
        <button id="btn-fullscreen" type="button" aria-label="전체화면">[전체화면]</button>
        <button id="btn-aspect" type="button" aria-label="화면비율">[비율: 꽉채움]</button>
      </div>
    </div>
    <div id="rotate-prompt">
      <div class="rotate-phone-icon"></div>
      <div class="rotate-title">[ 스마트폰을 가로로 돌려주세요 ]</div>
      <div class="rotate-sub">ROTATE DEVICE TO LANDSCAPE</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
