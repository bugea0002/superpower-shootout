<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SUPERPOWER SHOOTOUT - 이능력 승부차기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Galmode&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="arcade-shell">
      <div id="canvas-wrapper">
        <canvas id="game-canvas" width="480" height="270"></canvas>
        <div id="crt-overlay"></div>
      </div>
      <div id="controls-bar">
        <button id="fullscreen-btn" class="ctrl-group btn-action" type="button">
          <span class="key-badge">F</span> 전체화면
        </button>
        <div class="ctrl-group">
          <span class="key-badge">WASD / 터치</span> 조준 · 다이빙
        </div>
        <div class="ctrl-group">
          <span class="key-badge">SPACE / 탭</span> 파워 · 점프
        </div>
        <div class="ctrl-group">
          <span class="key-badge">1~4 / 버튼</span> 초능력
        </div>
        <div class="ctrl-group">
          <span class="key-badge">M</span> 사운드 &nbsp;|&nbsp; <span class="key-badge">C</span> CRT
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
